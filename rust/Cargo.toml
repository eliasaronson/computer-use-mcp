[package]
name = "computer-use-mcp"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
base64 = "0.23.1"
chrono = "0.4.45"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "pnm"] }
libc = "0.2"
regex = "1.13.1"
rmcp = { version = "3.5.1", features = ["server", "transport-streamable-http-server", "macros", "schemars"] }
rustix = { version = "1.1.5", features = ["fs", "process"] }
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
subtle = "2.6.1"
tokio = { version = "1.53.2", features = ["full"] }
toml = "1.1.8"
wayland-client = "0.31.15"
wayland-protocols-misc = { version = "0.3.12", features = ["client"] }
wayland-protocols-wlr = { version = "0.3.12", features = ["client"] }
